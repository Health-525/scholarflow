name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create draft release (only used when triggered by tag)"
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    name: Build Windows Electron App
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # node-gyp / npm 10+ 通过环境变量读取这些配置
      npm_config_msvs_version: 2022
      npm_config_python: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        shell: pwsh
        run: |
          npm run build
          node electron/postbuild.js
          npx electron-builder --win nsis --publish never

      - name: List build outputs
        shell: pwsh
        run: Get-ChildItem -Path dist/ | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scholarflow-windows-${{ github.ref_name || github.run_id }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.draft || false }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true
