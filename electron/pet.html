<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Desktop Pet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  overflow: hidden;
  user-select: none;
  width: 140px;
  height: 150px;
}
.pet-wrap {
  width: 140px;
  height: 150px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  -webkit-app-region: drag;
}

/* Speech bubble */
.bubble {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  color: #333;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  font-family: "Noto Sans SC", sans-serif;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 10;
}
.bubble::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 5px solid transparent;
  border-right: 5px solid transparent;
  border-top: 5px solid #fff;
}
.bubble.show { opacity: 1; }
.bubble.angry { background: #ffe0e0; color: #c0392b; }
.bubble.angry::after { border-top-color: #ffe0e0; }

/* Pet image */
.pet-img {
  width: 120px;
  height: 120px;
  object-fit: contain;
  image-rendering: auto;
  transition: transform 0.2s;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}

/* Animations */
@keyframes shake {
  0%, 100% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-4px) rotate(-3deg); }
  40% { transform: translateX(4px) rotate(3deg); }
  60% { transform: translateX(-3px) rotate(-2deg); }
  80% { transform: translateX(3px) rotate(2deg); }
}
@keyframes bounce {
  0% { transform: translateY(0); }
  30% { transform: translateY(-15px); }
  50% { transform: translateY(-5px); }
  70% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}
@keyframes breathe {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(1.03); }
}

.shake { animation: shake 0.4s ease-in-out infinite; }
.bounce { animation: bounce 0.5s ease-in-out; }
.breathe { animation: breathe 3s ease-in-out infinite; transform-origin: bottom center; }
</style>
</head>
<body>
<div class="pet-wrap">
  <div class="bubble" id="bubble"></div>
  <img class="pet-img breathe" id="petImg" src="" alt="pet" />
</div>

<script>
// petAPI 由 pet-preload.js 通过 contextBridge 注入，无需 require()
const petImg = document.getElementById('petImg');
const bubble = document.getElementById('bubble');

// 设置初始图片（使用 preload 注入的绝对路径）
petImg.src = petAPI.paths.normal;

const ANGRY_MESSAGES = [
  "别皱眉！放松额头！",
  "又抬眉了！住手！",
  "皱纹要来了！快松开！",
  "额头肌肉放松！",
  "别皱别皱别皱！",
  "抬头纹警告！",
  "放松放松放松！",
  "眉头松开！！",
];

let isAngry = false;
let angryTimeout = null;

function setAngry(score) {
  if (isAngry) return;
  isAngry = true;

  petImg.src = petAPI.paths.angry;
  petImg.className = 'pet-img shake bounce';

  bubble.textContent = ANGRY_MESSAGES[Math.floor(Math.random() * ANGRY_MESSAGES.length)] + ` (${Math.round(score)})`;
  bubble.classList.add('show', 'angry');

  if (angryTimeout) clearTimeout(angryTimeout);
  angryTimeout = setTimeout(setNormal, 4000);
}

function setNormal() {
  isAngry = false;
  petImg.src = petAPI.paths.normal;
  petImg.className = 'pet-img breathe';
  bubble.classList.remove('show', 'angry');
}

function setSleeping() {
  isAngry = false;
  petImg.src = petAPI.paths.sleeping;
  petImg.className = 'pet-img breathe';
  bubble.textContent = 'zzZ';
  bubble.classList.add('show');
  bubble.classList.remove('angry');
}

// 订阅来自主进程的抬眉警报（IPC 推送）
petAPI.onBrowAlert((data) => {
  setAngry(data.score || 50);
});

// 轮询 wrinkle-alert（降级方案，file:// 下 fetch 不可靠，通过 preload 封装的 http 模块轮询）
let SF_PORT = 3456;
let pollInterval = 3000;
let failCount = 0;
let pollTimer = null;

async function detectPort() {
  // 先试 3456，不通再试 3000
  const result = await petAPI.pollWrinkleAlert(3456, 1500);
  if (result !== null) return 3456;
  const result2 = await petAPI.pollWrinkleAlert(3000, 1500);
  if (result2 !== null) return 3000;
  return 3456; // 默认值
}

async function checkAlert() {
  const obj = await petAPI.pollWrinkleAlert(SF_PORT, 2000);
  if (obj !== null) {
    failCount = 0;
    pollInterval = 3000;
    if (obj.rising) setAngry(obj.score || 50);
  } else {
    failCount++;
    // 连续失败时逐步降低频率：3s → 6s → 10s → 30s
    pollInterval = Math.min(30000, 3000 * Math.pow(2, Math.min(failCount, 3)));
  }
  scheduleNext();
}

function scheduleNext() {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(checkAlert, pollInterval);
}

detectPort().then((port) => {
  SF_PORT = port;
  checkAlert();
});

// 右键关闭（通过 preload 桥接，不直接调用 ipcRenderer）
document.addEventListener('contextmenu', () => {
  petAPI.close();
});
</script>
</body>
</html>
